# Reverse proxy for the Electrical Safety Approval Assistant POC.
# Install as /etc/nginx/sites-available/electrical-poc and symlink into
# sites-enabled, then run certbot --nginx -d electrical-poc.140.238.131.77.nip.io
# (certbot rewrites this file to add the TLS listeners).
server {
    listen 80;
    listen [::]:80;
    server_name electrical-poc.140.238.131.77.nip.io;

    # Scanned drawings can be several MB.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Claude extraction/analysis calls can take well over a minute.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
